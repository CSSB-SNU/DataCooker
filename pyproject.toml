[project]
name = "DataCooker"
version = "0.1.0"
description = "Core recipe engine for declarative data processing pipelines"
readme = "README.md"
requires-python = ">=3.10"
authors = [{ name = "Sanggeun Park", email = "psk6950@snu.ac.kr" }]
keywords = ["workflow", "dag", "data-processing", "pipeline", "recipe"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = [
]

[project.optional-dependencies]
config = [
    "omegaconf>=2.3.0,<3",
]
cli = [
    "click>=8.1.0,<9",
    "omegaconf>=2.3.0,<3",
]
lmdb = [
    "joblib>=1.4.0,<2",
    "lmdb>=1.6.0,<2",
]
parallel = [
    "joblib>=1.4.0,<2",
]

[project.scripts]
datacooker-lmdb = "datacooker.cli.lmdb:main"
datacooker-workflow = "datacooker.cli.workflow:main"

[project.urls]
Homepage = "https://github.com/CSSB-SNU/DataCooker"
Repository = "https://github.com/CSSB-SNU/DataCooker"
Issues = "https://github.com/CSSB-SNU/DataCooker/issues"

[build-system]
build-backend = "hatchling.build"
requires = ["hatchling"]

[tool.ruff]
line-length = 88
target-version = "py310"

[tool.ruff.lint]
select = ["ALL"]
ignore = [
    "F722", # Incompatible with jaxtyping
    "D100", # Missing docstring in public module
    "D104", # Missing docstring in public package
    "C901", "PLR0911", "PLR0912", "PLR0915",  # complexity: pipelines are wide
    "PLR2004",  # magic values read fine in numeric/scientific code
    "COM812", # Formatter-compatible trailing comma handling
    "N806",
    "E501",
    "ANN401", # Public API accepts arbitrary workflow payloads
    "FBT001", "FBT002", "FBT003",  # Compatibility wrappers expose boolean flags
    "PLR0913", # Public compatibility APIs are intentionally wide
    "TC001", "TC002", "TC003",  # Postponed evaluation makes runtime imports fine
]

[tool.ruff.lint.pydocstyle]
convention = "numpy"

[tool.ruff.lint.per-file-ignores]
"tests/*.py" = ["D", "PT009", "PT027"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.pixi.workspace]
channels = ["conda-forge"]
platforms = ["linux-64"]

[tool.pixi.pypi-dependencies]
datacooker = { path = ".", editable = true }

[tool.pixi.dependencies]
python = "~=3.10"
ruff = ">=0.11.6,<0.12"
pytest = ">=8.4.1,<9"
ipykernel = ">=6.30.1,<7"


[tool.hatch.metadata]
allow-direct-references = true

[tool.hatch.build.targets.wheel]
packages = [
  "src/datacooker",
]
