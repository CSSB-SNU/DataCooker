site_name: DataCooker
site_description: A small, domain-agnostic static-workflow recipe engine.
site_url: https://CSSB-SNU.github.io/DataCooker/
repo_url: https://github.com/CSSB-SNU/DataCooker
repo_name: CSSB-SNU/DataCooker
docs_dir: docs_src

theme:
  name: material
  features:
    - navigation.instant
    - navigation.tracking
    - search.suggest
    - search.highlight
    - content.code.copy

markdown_extensions:
  - admonition
  - toc:
      permalink: true
  - footnotes
  - def_list
  - pymdownx.highlight
  - pymdownx.inlinehilite
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.details
  - pymdownx.tabbed:
      alternate_style: true

nav:
  - Concepts: index.md
  - Getting Started: getting-started.md
  - Tutorials:
      - Overview: tutorials.md
      - Write a recipe: tutorials/make_recipe_basic.md
      - Build an LMDB: tutorials/build_lmdb.md
  - API: api.md
